    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - specs/epics/nuxt-ai-editor
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - an editor placed from it carries the editor only, branded
  gates: []
